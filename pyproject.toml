[project]
name = "glyph"
version = "0.1.0"
description = "Glyph — a hidden-semantics DSL execution benchmark for weight-space delegation research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-instance pi sweeps"]
