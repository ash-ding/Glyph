[project]
name = "glyph"
version = "0.1.0"
description = "Glyph — a hidden-semantics DSL execution benchmark for weight-space delegation research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The protocol harness: the Claude Agent SDK (with its bundled CLI) drives the
# agent, and the metering gateway is an aiohttp server. The benchmark core
# stays numpy-only. The train arm additionally needs a GPU stack (torch,
# transformers, vllm, peft), installed via the conda env rather than pinned here.
agent = ["claude-agent-sdk==0.2.152", "aiohttp>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-API end-to-end runs, GPU tests, and multi-instance pi sweeps"]
