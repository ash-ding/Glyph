<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph — run viewer</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel2:#f0f0ee; --ink:#1a1a1c; --muted:#6b6b70;
  --line:#e2e2df; --accent:#4b56d2; --accent-soft:#e9eaf8;
  --good:#2f8f5b; --good-soft:#e4f2ea; --bad:#c0392b; --bad-soft:#fbe9e7;
  --warn:#b8860b; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){
  --bg:#141416; --panel:#1c1c1f; --panel2:#232327; --ink:#e9e9ec; --muted:#9a9aa2;
  --line:#2e2e33; --accent:#8b93f2; --accent-soft:#232748;
  --good:#5cc98a; --good-soft:#1c3327; --bad:#ff7a6b; --bad-soft:#3a201d; --warn:#e0b64a;
}}
:root[data-theme=dark]{
  --bg:#141416; --panel:#1c1c1f; --panel2:#232327; --ink:#e9e9ec; --muted:#9a9aa2;
  --line:#2e2e33; --accent:#8b93f2; --accent-soft:#232748;
  --good:#5cc98a; --good-soft:#1c3327; --bad:#ff7a6b; --bad-soft:#3a201d; --warn:#e0b64a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:5}
header .brand{font-weight:700;letter-spacing:.02em}
header .sub{color:var(--muted);font-size:12px}
header .spacer{flex:1}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:5px 10px;cursor:pointer;font-size:13px}
button.ghost:hover{background:var(--panel2)}
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 49px)}
@media(max-width:820px){.layout{grid-template-columns:1fr;height:auto}}
aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}
main{overflow-y:auto;padding:20px 24px}
.viewsw{display:flex;gap:6px;margin-bottom:12px}
.viewsw .seg{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px;font-weight:600}
.viewsw .seg:hover{border-color:var(--accent)}
.viewsw .seg.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select,.filters input{background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:5px 7px;font-size:13px;width:100%}
.count{font-size:12px;color:var(--muted);margin:4px 2px 10px}
.run{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.run:hover{border-color:var(--accent)}
.run.active{border-color:var(--accent);background:var(--accent-soft)}
.run .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.run .id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;word-break:break-all}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);color:var(--ink);white-space:nowrap}
.chip.arm-train{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.arm-no_train{background:var(--panel2);color:var(--muted);font-weight:600}
.chip.score{background:var(--good-soft);color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.chip.pi{background:var(--panel2);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:40px 10px;text-align:center}
h1.title{font-size:20px;margin:0 0 2px}
.meta{color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:14px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel)}
.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.refcard{grid-column:1/-1}
.refcard .facts{color:var(--muted);font-size:12px;margin:3px 0 8px}
.reftable{width:100%;border-collapse:collapse;margin-top:2px;font-size:12px}
.reftable th,.reftable td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.reftable th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.04em}
.reftable th:first-child,.reftable td:first-child{text-align:left;color:var(--muted);font-weight:400;text-transform:none}
.reftable tr.runrow td{font-weight:700;color:var(--accent)}
.reftable tr.splitrow td{text-align:left;color:var(--muted);font-size:11px;font-weight:400;padding-top:0;padding-bottom:5px}
details.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);overflow:hidden}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸ ";color:var(--muted)}
details.sec[open]>summary::before{content:"▾ "}
details.sec .body{padding:0 12px 12px}
pre{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.phasehdr{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:700;color:var(--accent)}
.phasehdr::after{content:"";flex:1;height:1px;background:var(--line)}
.turn{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.turn .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.turn .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:10px;padding:1px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.badge.practice{background:var(--accent-soft);color:var(--accent)}
.badge.final{background:var(--good-soft);color:var(--good)}
.think{font-size:11px;color:var(--muted)}
details.narr>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;margin:2px 0}
details.narr>summary::-webkit-details-marker{display:none}
details.narr>summary::before{content:"💬 reasoning ▸";}
details.narr[open]>summary::before{content:"💬 reasoning ▾";}
details.narr.think>summary::before{content:"💭 thinking ▸";}
details.narr.think[open]>summary::before{content:"💭 thinking ▾";}
details.narr .t{font-size:13px;white-space:pre-wrap;margin:6px 0;padding-left:8px;border-left:2px solid var(--line)}
.act{border:1px solid var(--line);border-radius:8px;margin:6px 0;overflow:hidden}
.act .ah{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel2)}
.act .tool{font-family:var(--mono);font-size:12px;font-weight:700}
.act.glyph .tool{color:var(--accent)}
.act .io{padding:0 9px 8px}
.act .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.act.err .ah{background:var(--bad-soft)}
.act.err .tool{color:var(--bad)}
.compact{text-align:center;color:var(--warn);font-size:12px;margin:14px 0;font-weight:600}
.compact::before,.compact::after{content:"···· ";letter-spacing:.2em}
.hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <span class="brand">◈ Glyph</span><span class="sub">run viewer</span>
  <span class="spacer"></span>
  <span class="sub" id="loadhint"></span>
  <button class="ghost" id="theme">◐ theme</button>
</header>
<div class="layout">
  <aside>
    <div class="viewsw" id="viewsw">
      <button class="seg" data-view="runs">Runs</button>
      <button class="seg" data-view="instances">Instances</button>
    </div>
    <div id="runs-block">
      <div class="filters">
        <label>arm
          <select id="f-arm"><option value="">all</option><option>no_train</option><option>train</option></select>
        </label>
        <label>preset
          <select id="f-preset"><option value="">all</option></select>
        </label>
        <label>instance
          <select id="f-instance"><option value="">all</option></select>
        </label>
      </div>
      <div class="count" id="count"></div>
      <div id="runs"></div>
    </div>
    <div id="instances-block" style="display:none">
      <div class="viewsw" id="bandsw">
        <button class="seg" data-band="low">low</button>
        <button class="seg" data-band="mid">mid</button>
        <button class="seg" data-band="high">high</button>
      </div>
      <div class="count" id="inst-count"></div>
      <div id="instances"></div>
    </div>
  </aside>
  <main id="detail"><div class="empty">Loading runs…</div></main>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const GLYPH_TOOLS=new Set(["query","submit","check_answers","finish_practice","build_dataset","train","student_infer","final_answer"]);
let INDEX=[], CURRENT=null, FROZEN=null, CEILINGS=null;
let VIEW="runs", BAND="low", CURRENT_INSTANCE=null;
try{ const v=localStorage.getItem("glyph-view"); if(v==="instances"||v==="runs") VIEW=v; }catch(e){}

// theme toggle
(function(){ let t=null; try{t=localStorage.getItem("glyph-theme")}catch(e){} if(t)document.documentElement.setAttribute("data-theme",t);
  $("#theme").onclick=()=>{const d=document.documentElement; const cur=d.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark"; d.setAttribute("data-theme",nx); try{localStorage.setItem("glyph-theme",nx)}catch(e){}};})();

function num(x,d){return (x==null||isNaN(x))?"—":Number(x).toFixed(d)}
function fmtJSON(v){try{return typeof v==="string"?v:JSON.stringify(v,null,2)}catch(e){return String(v)}}

// benchmark reference data (frozen instances + their cheap/expensive reference
// ceilings), copied by tools/collect_runs.py next to runs/index.json. Both are
// optional — a run viewer with no benchmark files must still work normally.
async function loadBenchmark(){
  try{ FROZEN=await (await fetch("runs/frozen_instances.json",{cache:"no-store"})).json(); }
  catch(e){ FROZEN=null; }
  try{ CEILINGS=await (await fetch("runs/reference_ceilings.json",{cache:"no-store"})).json(); }
  catch(e){ CEILINGS=null; }
}
function findInstance(cfg){
  try{
    if(!FROZEN||!Array.isArray(FROZEN.instances))return null;
    return FROZEN.instances.find(ins=>String(ins.seed)===String(cfg.seed)&&ins.preset===cfg.preset)||null;
  }catch(e){ return null; }
}
// instances to offer in the Runs-view #f-instance dropdown, scoped by the
// selected preset ("" / falsy = all 15; a specific preset = that preset's 5).
function instanceOptionsFor(preset){
  try{
    if(!FROZEN||!Array.isArray(FROZEN.instances))return [];
    const list=preset?FROZEN.instances.filter(i=>i.preset===preset):FROZEN.instances;
    return list.slice().sort((a,b)=>(a.measured_pi??0)-(b.measured_pi??0));
  }catch(e){ return []; }
}
function populateInstanceOptions(){
  const sel=$("#f-instance"); sel.innerHTML='<option value="">all</option>';
  for(const inst of instanceOptionsFor($("#f-preset").value)){
    const o=el("option",null,inst.id+" · π"+num(inst.measured_pi,3)); o.value=inst.id; sel.append(o);
  }
  sel.value="";
}
function refRow(table,label,ov,ta,hr,isRun){
  const tr=el("tr",isRun?"runrow":null);
  tr.append(el("td",null,label),el("td",null,num(ov,3)),el("td",null,num(ta,3)),el("td",null,num(hr,3)));
  table.append(tr);
}
// compact muted sub-row under an oracle row, showing its by_split breakdown
// (iid/comp/depth first, then any other split keys alphabetically). No-op
// when by_split is missing/empty — caller never renders it for the run row.
function splitRow(table,bySplit){
  if(!bySplit||typeof bySplit!=="object")return;
  const keys=Object.keys(bySplit);
  if(!keys.length)return;
  const pref=["iid","comp","depth"];
  const ordered=[...pref.filter(k=>keys.includes(k)),...keys.filter(k=>!pref.includes(k)).sort()];
  const tr=el("tr","splitrow");
  const td=el("td",null,ordered.map(k=>k+" "+num(bySplit[k],3)).join(" · "));
  td.colSpan=4;
  tr.append(td);
  table.append(tr);
}
// shared battery-rendering core: used both for a run's own reference card
// (runOverall/runTail from that run) and for the instance-catalog detail view
// (runOverall/runTail=null, so the "this run" row shows "—" — no run selected).
function referenceCard(inst,ceil,runOverall,runTail){
  const card=el("div","card refcard");
  if(!inst){
    card.append(el("div","k","reference"));
    card.append(el("div","v","not a frozen instance"));
    return card;
  }
  card.append(el("div","k","reference — "+inst.id+" ("+inst.band+")"));
  card.append(el("div","facts","measured π "+num(inst.measured_pi,3)+"  ·  binary tables "+(inst.uses_binary_tables?"yes":"no")));
  const table=el("table","reftable");
  const hd=el("tr"); hd.append(el("th",null,""),el("th",null,"overall"),el("th",null,"tail"),el("th",null,"headroom")); table.append(hd);
  refRow(table,"this run",runOverall,runTail,null,true);
  if(ceil){
    for(const k of ["skeleton","table","perfect"]){
      const v=ceil[k]; if(v){ refRow(table,k,v.overall,v.tail,v.headroom,false); splitRow(table,v.by_split); }
    }
    for(const k of ["weights","a0prime"]){
      const block=ceil[k];
      if(block&&typeof block==="object"){
        for(const frac of Object.keys(block).sort()){
          const v=block[frac]; if(v){ refRow(table,k+" @"+frac,v.overall,v.tail,v.headroom,false); splitRow(table,v.by_split); }
        }
      }
    }
  }
  card.append(table);
  if(!ceil) card.append(el("div","hint","no reference ceilings for this instance"));
  return card;
}
function buildReference(rj){
  const cfg=rj.config||{}, s=rj.summary||{}, rep=rj.report||{};
  let inst=null;
  try{ inst=findInstance(cfg); }catch(e){ inst=null; }
  if(!inst) return referenceCard(null,null,null,null);
  let ceil=null;
  try{ ceil=CEILINGS&&CEILINGS[inst.id]; }catch(e){ ceil=null; }
  return referenceCard(inst,ceil,s.overall,rep.tail);
}

async function boot(){
  let idx;
  const bench=loadBenchmark(); // kick off in parallel; loadBenchmark never throws
  try{ idx=await (await fetch("runs/index.json",{cache:"no-store"})).json(); }
  catch(e){ $("#detail").innerHTML=""; const d=el("div","empty"); d.innerHTML="Could not load <code>runs/index.json</code>.<br>Run <code>python tools/collect_runs.py --out viewer/runs &lt;out_root&gt;</code>, then serve the repo with <code>python -m http.server</code> and open <code>/viewer/</code>."; $("#detail").append(d); return; }
  INDEX=idx||[];
  try{ await bench; }catch(e){}
  // preset options: the union of the benchmark's presets (so pi_low/pi_high are
  // offered even when no runs exist yet for them, since preset now scopes the
  // instance selector) and whatever presets actually appear in the runs index;
  // ordered low->mid->high, with any stray non-benchmark preset appended after.
  const ORD={pi_low:0,pi_mid:1,pi_high:2};
  const fp=(FROZEN&&Array.isArray(FROZEN.instances))?FROZEN.instances.map(i=>i.preset):[];
  const presets=[...new Set([...fp,...INDEX.map(r=>r.preset)].filter(Boolean))]
    .sort((a,b)=>((ORD[a]??99)-(ORD[b]??99))||(a<b?-1:a>b?1:0));
  for(const p of presets){const o=el("option",null,p);o.value=p;$("#f-preset").append(o)}
  for(const id of ["f-arm","f-instance"]) $("#"+id).oninput=render;
  $("#f-preset").oninput=()=>{ populateInstanceOptions(); render(); };
  populateInstanceOptions();
  for(const b of $$("#viewsw .seg")) b.onclick=()=>setView(b.dataset.view);
  for(const b of $$("#bandsw .seg")) b.onclick=()=>selectBand(b.dataset.band);
  applyView();
}
// view switch: "runs" (default, existing behavior) or "instances" (band -> id catalog).
// Persisted in localStorage so a reload keeps the last-picked view.
function applyView(preferredRunId){
  for(const b of $$("#viewsw .seg")) b.classList.toggle("active",b.dataset.view===VIEW);
  $("#runs-block").style.display=VIEW==="runs"?"":"none";
  $("#instances-block").style.display=VIEW==="instances"?"":"none";
  if(VIEW==="runs"){
    render();
    const id=preferredRunId||CURRENT||(filtered()[0]&&filtered()[0].id)||(INDEX[0]&&INDEX[0].id);
    if(id) load(id); else $("#detail").innerHTML='<div class="empty">No runs.</div>';
  } else {
    selectBand(BAND);
  }
}
function setView(v){
  VIEW=(v==="instances")?"instances":"runs";
  try{localStorage.setItem("glyph-view",VIEW)}catch(e){}
  applyView();
}
// switches to the Runs view and opens `id` (used by an instance's associated-runs list)
function goToRun(id){
  VIEW="runs";
  try{localStorage.setItem("glyph-view","runs")}catch(e){}
  applyView(id);
}
function instancesForBand(band){
  try{
    if(!FROZEN||!Array.isArray(FROZEN.instances))return [];
    return FROZEN.instances.filter(i=>i.band===band)
      .slice().sort((a,b)=>(a.measured_pi??0)-(b.measured_pi??0));
  }catch(e){ return []; }
}
function selectBand(band){
  BAND=band;
  for(const b of $$("#bandsw .seg")) b.classList.toggle("active",b.dataset.band===band);
  renderInstances();
  if(!FROZEN||!Array.isArray(FROZEN.instances)){
    CURRENT_INSTANCE=null;
    $("#detail").innerHTML='<div class="empty">Benchmark data not available.</div>';
    return;
  }
  const list=instancesForBand(band);
  if(CURRENT_INSTANCE&&list.some(i=>i.id===CURRENT_INSTANCE)){
    loadInstance(CURRENT_INSTANCE);
  } else if(list.length){
    loadInstance(list[0].id);
  } else {
    CURRENT_INSTANCE=null;
    $("#detail").innerHTML='<div class="empty">No instances in this band.</div>';
  }
}
function renderInstances(){
  const box=$("#instances"); box.innerHTML="";
  if(!FROZEN||!Array.isArray(FROZEN.instances)){
    $("#inst-count").textContent="";
    box.append(el("div","empty","Benchmark data not available."));
    return;
  }
  const list=instancesForBand(BAND);
  $("#inst-count").textContent=list.length+" instance"+(list.length===1?"":"s")+" in "+BAND;
  if(!list.length){ box.append(el("div","empty","No instances in this band.")); return; }
  for(const inst of list){
    const card=el("div","run"+(CURRENT_INSTANCE===inst.id?" active":"")); card.dataset.id=inst.id;
    const top=el("div","top");
    top.append(el("span","chip",inst.id));
    top.append(el("span","chip pi","π "+num(inst.measured_pi,3)));
    if(inst.uses_binary_tables) top.append(el("span","chip","tables"));
    card.append(top);
    card.onclick=()=>{ CURRENT_INSTANCE=inst.id; loadInstance(inst.id); };
    box.append(card);
  }
}
// runs associated with a frozen instance: explicit instance_id match, else the
// pre-R1 seed+preset fallback via findInstance() so older runs still associate.
function associatedRuns(instId){
  try{
    return INDEX.filter(r=>{
      if(r.instance_id) return r.instance_id===instId;
      let m=null;
      try{ m=findInstance({preset:r.preset,seed:r.seed}); }catch(e){ m=null; }
      return !!(m&&m.id===instId);
    });
  }catch(e){ return []; }
}
function loadInstance(id){
  CURRENT_INSTANCE=id; renderInstances();
  const m=$("#detail"); m.innerHTML="";
  if(!FROZEN||!Array.isArray(FROZEN.instances)){ m.append(el("div","empty","Benchmark data not available.")); return; }
  const inst=FROZEN.instances.find(i=>i.id===id);
  if(!inst){ m.append(el("div","empty","Instance not found: "+id)); return; }
  m.append(el("h1","title",inst.id));
  m.append(el("div","meta",(inst.band||"?")+"  ·  "+(inst.preset||"?")+"  ·  π "+num(inst.measured_pi,3)+
    "  ·  uses_binary_tables: "+(inst.uses_binary_tables?"true":"false")));
  const cards=el("div","cards");
  let ceil=null;
  try{ ceil=CEILINGS&&CEILINGS[inst.id]; }catch(e){ ceil=null; }
  try{ cards.append(referenceCard(inst,ceil,null,null)); }catch(e){ /* never blank the page over a benchmark lookup */ }
  m.append(cards);
  const runs=associatedRuns(inst.id);
  const arBox=el("div");
  if(!runs.length){
    arBox.append(el("div","hint","no recorded runs yet for this instance"));
  } else {
    for(const r of runs){
      const card=el("div","run"); card.dataset.id=r.id;
      const top=el("div","top");
      top.append(el("span","chip arm-"+(r.arm||""),r.arm||"?"));
      top.append(el("span","chip","seed "+(r.seed??"?")));
      if(r.overall!=null) top.append(el("span","chip score",num(r.overall,3)));
      top.append(el("span","chip","$"+num(r.spent_usd,2)));
      card.append(top);
      card.append(el("div","id",r.id));
      card.onclick=()=>goToRun(r.id);
      arBox.append(card);
    }
  }
  m.append(section("Associated runs ("+runs.length+")",arBox,true));
}
// same run<->instance matching rule as associatedRuns(): explicit instance_id
// match, else the pre-R1 seed+preset fallback via findInstance().
function matchesInstance(r,instId){
  if(!instId) return true;
  if(r.instance_id) return r.instance_id===instId;
  let m=null;
  try{ m=findInstance({preset:r.preset,seed:r.seed}); }catch(e){ m=null; }
  return !!(m&&m.id===instId);
}
function filtered(){
  const a=$("#f-arm").value, p=$("#f-preset").value, inst=$("#f-instance").value;
  return INDEX.filter(r=>(!a||r.arm===a)&&(!p||r.preset===p)&&matchesInstance(r,inst));
}
function render(){
  const list=filtered(); const box=$("#runs"); box.innerHTML="";
  $("#count").textContent=list.length+" of "+INDEX.length+" run"+(INDEX.length===1?"":"s");
  if(!list.length){box.append(el("div","empty","No runs match."));return}
  for(const r of list){
    const card=el("div","run"+(CURRENT===r.id?" active":"")); card.dataset.id=r.id;
    const top=el("div","top");
    top.append(el("span","chip arm-"+(r.arm||""),r.arm||"?"));
    top.append(el("span","chip",r.preset||"?"));
    top.append(el("span","chip","seed "+(r.seed??"?")));
    if(r.pi!=null)top.append(el("span","chip pi","π "+num(r.pi,2)));
    if(r.overall!=null)top.append(el("span","chip score",num(r.overall,3)));
    card.append(top);
    const sub=el("div","top");sub.style.marginTop="6px";
    sub.append(el("span","chip","$"+num(r.spent_usd,2)));
    sub.append(el("span","chip",(r.n_turns??"?")+" turns"));
    sub.append(el("span","chip",r.run_status||"?"));
    card.append(sub);
    card.append(el("div","id",r.id));
    card.onclick=()=>load(r.id);
    box.append(card);
  }
}
async function load(id){
  CURRENT=id; render();
  $("#detail").innerHTML='<div class="empty">Loading run…</div>';
  let rj; try{ rj=await (await fetch("runs/"+encodeURIComponent(id)+".json",{cache:"no-store"})).json(); }
  catch(e){ $("#detail").innerHTML='<div class="empty">Failed to load '+id+'</div>'; return; }
  renderRun(rj);
}
function section(title,contentEl,open){
  const d=el("details","sec"); if(open)d.open=true;
  d.append(el("summary",null,title)); const b=el("div","body"); b.append(contentEl); d.append(b); return d;
}
function renderRun(rj){
  const m=$("#detail"); m.innerHTML="";
  const cfg=rj.config||{}, s=rj.summary||{}, rep=rj.report||{};
  m.append(Object.assign(el("h1","title",rj.id),{}));
  m.append(el("div","meta",(rj.created||"")+"  ·  model "+(cfg.model||"?")+"  ·  effort "+(cfg.effort||"?")));
  // stat cards
  const cards=el("div","cards");
  const stat=(k,v)=>{const c=el("div","card");c.append(el("div","k",k));c.append(el("div","v",v));return c};
  cards.append(stat("overall",num(s.overall,3)));
  const by=rep.by_split||{}; cards.append(stat("iid / comp / depth",[by.iid,by.comp,by.depth].map(x=>num(x,2)).join(" / ")));
  cards.append(stat("π (measured)",num(s.pi,3)));
  cards.append(stat("spent",("$"+num(s.spent_usd,2))));
  cards.append(stat("turns",s.n_turns??"—"));
  const gpu=(rep.ledger||{}).gpu_seconds; if(gpu&&gpu._total!=null)cards.append(stat("gpu sec",num(gpu._total,1)));
  try{ cards.append(buildReference(rj)); }catch(e){ /* never blank the page over a benchmark lookup */ }
  m.append(cards);
  // collapsibles: config, prompts, task
  const cfgPre=el("pre",null,fmtJSON(cfg)); m.append(section("Configuration",cfgPre));
  const pr=rj.prompts||{};
  m.append(section("System prompt (measurement)",el("pre",null,pr.system||"—")));
  m.append(section("Practice opener",el("pre",null,pr.practice_opener||"—")));
  m.append(section("Final opener",el("pre",null,pr.final_opener||"—")));
  m.append(section("Task (README the agent saw)",el("pre",null,(rj.task||{}).readme||"—")));
  m.append(section("Full report (JSON)",el("pre",null,fmtJSON(rep))));
  // transcript
  const tr=rj.transcript||[]; let phase=null;
  const th=el("h2"); th.style.margin="20px 0 4px"; th.textContent="Transcript"; m.append(th);
  m.append(Object.assign(el("div","hint"),{textContent:"Reasoning is shown per turn when captured; turns marked 'thinking ×N (redacted)' had encrypted/older thinking the CLI did not retain."}));
  for(const t of tr){
    if(t.kind==="compaction"){ m.append(Object.assign(el("div","compact"),{textContent:"context compacted"})); continue; }
    if(t.phase!==phase){ phase=t.phase; const h=el("div","phasehdr"); h.append(document.createTextNode((phase||"").toUpperCase()+" phase")); m.append(h); }
    m.append(renderTurn(t));
  }
}
function renderTurn(t){
  const box=el("div","turn");
  const hd=el("div","hd");
  hd.append(el("span","badge "+(t.phase||""),t.phase||""));
  hd.append(el("span","n","turn "+t.turn));
  const hasThinkingText=(t.thinking_texts||[]).length>0;
  if(!hasThinkingText&&t.thinking_redacted)hd.append(el("span","think","💭 thinking ×"+t.thinking_redacted+" (redacted)"));
  box.append(hd);
  if(hasThinkingText){
    const td=el("details","narr think"); td.append(el("summary"));
    for(const tx of t.thinking_texts) td.append(el("div","t",tx));
    box.append(td);
  }
  if((t.text||[]).length){
    const d=el("details","narr"); d.append(el("summary"));
    for(const tx of t.text) d.append(el("div","t",tx));
    box.append(d);
  }
  for(const a of (t.actions||[])){
    const isGlyph=!!a.name&&(a.name.startsWith("mcp__glyph__")||GLYPH_TOOLS.has(a.name));
    const bare=(a.name||"").replace(/^mcp__glyph__/,"");
    const ac=el("div","act"+(isGlyph?" glyph":"")+(a.is_error?" err":""));
    const ah=el("div","ah"); ah.append(el("span","tool",(isGlyph?"glyph:":"")+bare));
    if(a.is_error){const eb=el("span","badge","error");eb.style.background="var(--bad-soft)";eb.style.color="var(--bad)";ah.append(eb);}
    ac.append(ah);
    const io=el("div","io");
    if(a.input!=null&&(typeof a.input!=="object"||Object.keys(a.input).length)){io.append(el("div","lbl","input"));io.append(el("pre",null,fmtJSON(a.input)))}
    if(a.result!=null){io.append(el("div","lbl","result"));io.append(el("pre",null,String(a.result).slice(0,4000)))}
    ac.append(io); box.append(ac);
  }
  return box;
}
boot();
</script>
